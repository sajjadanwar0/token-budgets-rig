[package]
name = "token-budgets-rig"
version = "0.1.0"
edition = "2024"
description = "N=1 deployment of the affine-typed token-budgets crate into the Rig Rust LLM-agent framework"
license = "MIT OR Apache-2.0"

[dependencies]
token-budgets = { git = "https://github.com/sajjadanwar0/token-budgets" }
anyhow = "1"

# Rig and the async runtime are only needed by the *live* example, not the
# library or the offline test, so they live in dev-dependencies.
[dev-dependencies]
rig-core = "=0.37.0"   # pinned. NB: 0.37 imports as `rig_core` (it dropped the `rig` alias)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1.0"
# Second framework (architecturally distinct, actor-model). Confirm version with
# `cargo add autoagents` -- 0.3.5 at time of writing.
autoagents = { version = "0.3.7", features = ["anthropic"] }
autoagents-derive = "0.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # the agent/AgentOutput derive macros expand to serde_json:: paths

[features]
default = []
# Swap the byte-length estimator for token-budgets' real tokenizer estimator.
tiktoken = ["token-budgets/tiktoken"]